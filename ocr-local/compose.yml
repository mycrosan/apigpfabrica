services:
  ocr:
    build: .
    environment:
      OCR_TOKEN: ${OCR_TOKEN:?Configure um token interno}
      OCR_MODELS_DIR: /models
    volumes:
      - ./models:/models:ro
    ports:
      - "127.0.0.1:8091:8091"
    networks: [ocr_interna]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/ready')"]
      interval: 30s
      timeout: 5s
      start_period: 120s
networks:
  ocr_interna:
    internal: true
