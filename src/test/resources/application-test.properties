# Configuração H2 para testes
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate para testes
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT para testes
gppremium.jwt.secret=testSecret123456789012345678901234567890
gppremium.jwt.expiration=86400000

# Logs - Configuração limpa para testes
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.boot=WARN
logging.level.org.hibernate=WARN
logging.level.org.h2=WARN
logging.level.br.compneusgppremium=WARN
logging.level.com.zaxxer.hikari=WARN

# Desabilitar logs desnecessários
logging.level.org.springframework.test=WARN
logging.level.org.springframework.boot.test=WARN
logging.level.org.springframework.context=WARN