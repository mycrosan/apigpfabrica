spring:
  config:
    import: optional:file:.env[.properties],optional:file:ocr-local/.env[.properties]
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: true # Compatibilidade dos endpoints legados ainda não migrados para DTO.
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # Cria linha de baseline automaticamente em bancos SEM flyway_schema_history.
    # Marcamos o estado inicial como sendo a 1.9.0 (a ultima migration estrutural):
    # assim o Flyway considera V1.7.1 -> V1.9.0 ja aplicadas e so executa V1.9.1+.
    # Como todas as migrations estruturais ja foram ajustadas para IF NOT EXISTS,
    # mesmo que o baseline falhe em detectar, a reexecucao eh segura.
    baseline-on-migrate: true
    baseline-version: 1.9.0
    baseline-description: baseline-estado-legado-fabrica
  data:
    rest:
      base-path: /api
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB
gppremium:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}
pneus:
  revisao:
    diretorio: ${REVISAO_DIRETORIO:./uploads/revisao}
    coleta-habilitada: ${REVISAO_COLETA:true}
    intervalo-ms: 60000
  evidencias:
    diretorio: ${EVIDENCIAS_DIRETORIO:./uploads/leitura}
    reconciliacao-habilitada: ${EVIDENCIAS_RECONCILIACAO:false}
    reconciliacao-intervalo-ms: 60000
  politica:
    fuso: America/Sao_Paulo
    ano-minimo: 2000
    validar-semana-futura: false
    tolerancia-semanas: 0
    segmentos: [PASSEIO, VAN, CAMINHONETE]
    familias-medida: [METRICA_RADIAL, POLEGADAS_RADIAL, FLUTUACAO]
  ocr:
    diagnostico:
      salvar-json: ${OCR_DIAGNOSTICO_SALVAR_JSON:true}
      diretorio: ${OCR_DIAGNOSTICO_DIRETORIO:diagnostico-ocr}
    url: ${OCR_URL:http://localhost:8091}
    token: ${OCR_TOKEN:}
    timeout-segundos: 15
    habilitado: ${PNEUS_OCR_HABILITADO:false}
    # Campos cujo resultado do OCR pode virar sugestão na tela. Sugestão sempre exige
    # confirmação do operador; campo fora desta lista continua manual.
    campos-aprovados: ${PNEUS_OCR_CAMPOS_APROVADOS:DOT}
    escore-minimo: 0.90
    limite-bytes: 8388608
    limite-pixels: 20000000
    # Proteção de circuito: evita que cada operador espere o timeout inteiro com o serviço fora do ar.
    falhas-para-abrir: 3
    abertura-segundos: 30
